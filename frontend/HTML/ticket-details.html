<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Details - HelpDesk</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <h2>HelpDesk</h2>

        <nav>
            <a href="dashboard.html">My Tickets</a>
            <a href="create-ticket.html">Create Ticket</a>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>


    <main>

        <section class="ticket-details">

            <div class="ticket-details-header">
                <div>
                    <h1 id="ticketTitle">Ticket Details</h1>
                    <p id="ticketStatus">Loading...</p>
                </div>

                <a href="dashboard.html">← Back to Tickets</a>
            </div>


            <div class="ticket-info">

                <div class="ticket-field">
                    <h3>Description</h3>
                    <p id="ticketDescription"></p>
                </div>

                <div class="ticket-field">
                    <h3>Category</h3>
                    <p id="ticketCategory"></p>
                </div>

                <div class="ticket-field">
                    <h3>Priority</h3>
                    <p id="ticketPriority"></p>
                </div>

                <div class="ticket-field">
                    <h3>Status</h3>
                    <p id="ticketStatusDetails"></p>
                </div>

                <div class="ticket-field">
                    <h3>Created Date</h3>
                    <p id="ticketCreatedAt"></p>
                </div>

                <div class="ticket-field">
                    <h3>Creator</h3>
                    <p id="ticketCreator"></p>
                </div>
                <div class="ticket-actions">
                <a id="updateTicketBtn" href="#">Update Ticket</a>
                </div>
                <button id="deleteTicketBtn">Delete Ticket</button>

            </div>
             <!-- Comments Section  -->
<div class="comments-section">

    <h2>Comments</h2>

    
    <div id="commentsContainer">
        <p>No comments yet.</p>
    </div>

    
    <form id="commentForm">
        <textarea
            id="commentMessage"
            placeholder="Write your comment..."
            required
        ></textarea>

        <button type="submit">Add Comment</button>
    </form>

</div>

        </section>

    </main>


    <script src="../JS/app.js"></script>

</body>
</html>
